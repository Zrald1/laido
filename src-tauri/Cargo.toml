[package]
name = "laido"
version = "0.0.4"
description = "Laido — a notepad that acts on what you write"
edition = "2021"
license = "Apache-2.0"
homepage = "https://laido.zraldwebdevelopmentservices.shop"
repository = "https://github.com/Zrald1/laido"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "webview-data-url"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "gzip", "brotli", "stream"] }
encoding_rs = "0.8"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
sys-locale = "0.3"
lopdf = "0.36"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
cpal = "0.15"
hound = "3.5"
tokio = { version = "1", features = ["time", "macros", "process"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
calamine = "0.36.1"
rust_xlsxwriter = "0.99.1"
regex = "1.11"
# engine sleep/memory levers — TrySuspend + MemoryUsageTargetLevel on the
# child WebView2s the pageview lane owns (versions match wry's graph).
# cfg-gated: the windows-* crate family cannot compile off-Windows.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
