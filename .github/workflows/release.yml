name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS (Apple Silicon)
          - platform: ubuntu-22.04
            label: Linux
          - platform: windows-latest
            label: Windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libxdo-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # import the signing cert into the runner's CURRENT USER store —
      # signtool /sha1 only searches CurrentUser\My by default (Windows only)
      - name: Import signing certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $b64 = "${{ secrets.LAIDO_SIGN_PFX }}"
          if (-not $b64) { throw "LAIDO_SIGN_PFX secret is not set" }
          [IO.File]::WriteAllBytes("$env:TEMP\sign.pfx", [Convert]::FromBase64String($b64))
          certutil -f -user -importpfx -p "${{ secrets.LAIDO_SIGN_PFX_PASSWORD }}" "$env:TEMP\sign.pfx"
          if ($LASTEXITCODE) { throw "cert import failed" }
          # prove signtool can find + use the cert before the real build
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                Where-Object { $_.FullName -like "*\x64\*" } | Sort-Object FullName -Descending |
                Select-Object -First 1 -ExpandProperty FullName
          Copy-Item "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" "$env:TEMP\test-sign.exe"
          & $st sign /fd sha256 /sha1 467F2297F5AC262A4397EC253B43FC139D66F96E "$env:TEMP\test-sign.exe"
          if ($LASTEXITCODE) { throw "signtool verification failed" }

      # a tag push (v*) builds AND publishes a GitHub Release with the
      # installers; a plain main push just verifies the build on all platforms
      - name: Build Laido
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "Laido ${{ github.ref_name }}"
          releaseBody: |
            **Laido — the notepad that acts on what you write.**

            Installers for every platform are attached below. Windows builds are
            code-signed (self-signed dev cert — SmartScreen may still ask you to
            confirm on the first launch while reputation builds).

            - **Windows:** `.msi` or `.exe` (NSIS)
            - **macOS:** `.dmg` (Apple Silicon)
            - **Linux:** `.AppImage`, `.deb`, `.rpm`

            First launch: open Settings and add your Nebius / Tavily /
            AssemblyAI keys. Your notes live in `Documents/Laido`.
          releaseDraft: false
          prerelease: false
